# Frozen Daily final-model configuration.
# Migrated from the supplied daily_final.yaml; selected values are preserved.
# This file is for final-model reproduction, not initial model search.

default_pipeline: daily


data:
  daily_path: data/processed/spy_labeled_daily.csv
  weekly_path: data/processed/spy_labeled_weekly.csv
  target: target_return
  training_start_year: 2010

validation:
  start_year: 2018
  end_year: 2021
  selection_metric: pooled_rmse
  secondary_metrics: [pooled_mae, pooled_r2]
  aggregation: pooled

test:
  start_year: 2022
  end_year: 2025

training:
  window: rolling
  window_years: 5
  retraining: monthly
  label_availability_rule: holding_end_date_before_retraining


pipelines:
  daily:
    data_key: daily_path
    features:
      - return_1d
      - momentum_5d
      - volatility_20d
      - volatility_60d
      - vix
      - intraday_return
      - overnight_return
      - gap_reversal
      - tlt_return_5d
      - yield_2y_change_5d
      - yield_10y_change_5d
      - yield_10y_change_20d
      - yield_curve_10y_2y
      - real_yield_10y_change_5d
    signal_interval_trading_days: 1
    prediction_horizon_trading_days: 1
    holding_period_trading_days: 1
    execution: next_trading_day_open

models:
  lasso:
    max_iter: 20000
    param_grid:
      regressor__alpha: [0.000225]

experiment:
  name: daily_final_model_reproduction
  random_seed: 5205
  output_dir: outputs

final_model_record:
  name: lasso
  params:
    regressor__alpha: 0.000225
  validation_metrics:
    pooled_rmse: 0.0118195533
    pooled_mae: 0.00780429
    pooled_r2: 0.026268
  validation_period: [2018, 2021]
  independent_test_period: [2022, 2025]
