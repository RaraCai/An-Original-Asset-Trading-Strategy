data:
  path: data/processed/spy_labeled.csv
  target: target_return
  training_start_year: 2010

features:
  - return_1d
  - momentum_5d
  - momentum_20d
  - volatility_5d
  - volatility_20d
  - volatility_60d
  - ma_gap_5_20
  - vix
  - rsi_14
  - relative_volume_20d
  - intraday_return

validation:
  start_year: 2018
  end_year: 2021
  selection_metric: rmse

test:
  start_year: 2022
  end_year: 2025

models:
  random_forest:
    n_estimators: 150
    n_jobs: -1
    param_grid:
      max_depth: [3, 6, null]
      min_samples_leaf: [5, 20]
      max_features: [0.7, 1.0]
  ols:
    param_grid: {}
  lasso:
    max_iter: 10000
    param_grid:
      regressor__alpha: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  ridge:
    param_grid:
      regressor__alpha: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]

experiment:
  random_seed: 5205
  output_dir: outputs/models
  model_dir: fitted_models
