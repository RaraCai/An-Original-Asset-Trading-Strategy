# ============================================================
# DSA5205 Project 2 - Reproducible experiment configuration
#
# HOW TO REPRODUCE AN EXPERIMENT
# 1. Select the feature block and model block for the experiment.
# 2. Uncomment the two selected blocks; comment out their alternatives.
# 3. Keep exactly one 'features:' and one 'models:' key in the YAML.
# 4. Run: python src/models/train.py --pipeline daily
#
# EXPERIMENT GUIDE
# Initial model search: 21-feature pool + five-model initial grid.
# Daily Lasso refinement (round 1): G5 14-feature set + Model Grid B.
# Daily Lasso refinement (round 2): G5 14-feature set + Model Grid C.
# Feature ablation: use the dedicated ablation_daily.py script and
#   its recorded experiment definitions; do not infer ablation settings
#   from the feature block selected here.
# Weekly experiments: start with the initial feature/model blocks;
#   choose a separate final feature set and tuning grid from Weekly results.
#
# The uncommented blocks below reproduce the initial model search.
# Their uncommented status is NOT a permanent designation.
# ============================================================

data:
  daily_path: data/processed/spy_labeled_daily.csv
  weekly_path: data/processed/spy_labeled_weekly.csv
  target: target_return
  training_start_year: 2010

# ============================================================
# FEATURE SET OPTION A: INITIAL MODEL SEARCH (21 FEATURES)
# Use for the first model search in either pipeline.
# Comment out Option B before uncommenting this block.
# ============================================================
features:
  - return_1d
  - momentum_5d
  - momentum_20d
  - volatility_5d
  - volatility_20d
  - volatility_60d
  - ma_gap_5_20
  - vix
  - rsi_14
  - relative_volume_20d
  - intraday_return
  - overnight_return
  - intraday_momentum_5d
  - gap_reversal
  - qqq_spy_relative_5d
  - tlt_return_5d
  - yield_2y_change_5d
  - yield_10y_change_5d
  - yield_10y_change_20d
  - yield_curve_10y_2y
  - real_yield_10y_change_5d


# ============================================================
# FEATURE SET OPTION B: DAILY G5 (14 FEATURES)
# Use for Daily Lasso refinement; comment out Option A.
# ============================================================
# features:
#   - return_1d
#   - momentum_5d
#   - volatility_20d
#   - volatility_60d
#   - vix
#   - intraday_return
#   - overnight_return
#   - gap_reversal
#   - tlt_return_5d
#   - yield_2y_change_5d
#   - yield_10y_change_5d
#   - yield_10y_change_20d
#   - yield_curve_10y_2y
#   - real_yield_10y_change_5d


# ============================================================
# SHARED DATA SPLITS AND ROLLING TRAINING RULES
# Used across model searches and refinement experiments.
# ============================================================
validation:
  start_year: 2018
  end_year: 2021
  selection_metric: rmse
  secondary_metrics: [mae, r2]
  aggregation: pooled

test:
  start_year: 2022
  end_year: 2025

training:
  window: rolling
  window_years: 5
  retraining: monthly
  label_availability_rule: holding_end_date_before_retraining

pipelines:
  daily:
    data_key: daily_path
    signal_interval_trading_days: 1
    prediction_horizon_trading_days: 1
    holding_period_trading_days: 1
  weekly:
    data_key: weekly_path
    signal_interval_trading_days: 5
    prediction_horizon_trading_days: 5
    holding_period_trading_days: 5

# ============================================================
# MODEL GRID OPTION A: INITIAL SEARCH (5 MODELS, 31 CANDIDATES)
# Use with Feature Set Option A for the initial model comparison.
# Comment out Model Grid Options B and C before uncommenting this block.
# ============================================================
models:
  ols:
    param_grid: {}
  ridge:
    param_grid:
      regressor__alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  lasso:
    max_iter: 20000
    param_grid:
      regressor__alpha: [0.00001, 0.00005, 0.0001, 0.0002, 0.0005, 0.001, 0.005, 0.01]
  random_forest:
    n_estimators: 200
    n_jobs: -1
    param_grid:
      max_depth: [3, 6]
      min_samples_leaf: [5, 20]
      max_features: [0.7, 1.0]
  xgboost:
    objective: reg:squarederror
    n_estimators: 300
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: 4
    param_grid:
      max_depth: [2, 4]
      min_child_weight: [5, 20]
      reg_lambda: [1, 10]


# ============================================================
# MODEL GRID OPTION B: DAILY LASSO REFINEMENT ROUND 1 (13 CANDIDATES)
# Use with Feature Set Option B (G5, 14 features).
# To reproduce round 1, uncomment Option B and comment out A and C.
# ============================================================
# models:
#   lasso:
#     max_iter: 20000
#     param_grid:
#       regressor__alpha: [0.000100, 0.000125, 0.000150, 0.000175, 0.000200, 0.000225, 0.000250, 0.000275, 0.000300, 0.000325, 0.000350, 0.000375, 0.000400]


# ============================================================
# MODEL GRID OPTION C: DAILY LASSO FINAL LOCAL REFINEMENT (11 CANDIDATES)
# Use with Feature Set Option B (G5, 14 features).
# To reproduce this experiment, uncomment Option C and comment out
# Options A and B. This grid refines around alpha = 0.000225.
# ============================================================
# models:
#   lasso:
#     max_iter: 20000
#     param_grid:
#       regressor__alpha: [0.000200, 0.000205, 0.000210, 0.000215, 0.000220, 0.000225, 0.000230, 0.000235, 0.000240, 0.000245, 0.000250]


experiment:
  random_seed: 5205
  output_dir: outputs
