# ============================================================
# DSA5205 Project 2 - Reproducible experiment configuration
#
# HOW TO REPRODUCE AN EXPERIMENT
# - Daily uses the top-level `features` block.
# - Weekly uses the feature list under `pipelines.weekly.features`.
# - For Weekly experiments, keep exactly ONE uncommented feature list
#   under `pipelines.weekly.features` and comment out the other options.
# - This copy is prepared specifically for Weekly R6-D Lasso alpha refinement.
# - Daily feature definitions are preserved, but the active model grid below is Lasso-only;
#   restore the original shared model grid before running Daily experiments.
# - Run: python src/models/train.py --pipeline weekly
#
# EXPERIMENT GUIDE
# Initial model search: 21-feature pool + five-model initial grid.
# Daily Lasso refinement (round 1): G5 14-feature set + Model Grid B.
# Daily Lasso refinement (round 2): G5 14-feature set + Model Grid C.
# Feature ablation: use the dedicated ablation_daily.py script and
#   its recorded experiment definitions; do not infer ablation settings
#   from the feature block selected here.
# Weekly feature experiments:
#   W0 = original 21 daily-derived features.
#   W1 = original 21 + 8 weekly aggregated features (29 total).
#   W2 = weekly-only 8 aggregated features.
#   Legacy W3 (8 weekly + 5 macro features) was evaluated and is retired.
#   New W3 = 16 dedicated five-session core features.
#   W3-A = W3 + weekly_compounded_return_5d.
#   W3-B = W3 + weekly_gap_reversal_mean_5d.
#   W3-C = W3 + weekly_mean_vix_5d.
#   W3-D = W3 + A/B/C additions (19 features); retained as an experiment record.
#   W4 = W3 core + 5 weekly-aligned FRED macro features (21 features).
#   W4-B = W4 + the four-feature Gap Reversal family (25 features).
#   W5 = W4-B plus 10 non-duplicate teammate features (35-feature candidate pool).
#   R6-D = selected 14-feature Weekly candidate for Lasso alpha refinement.
#   W0/W1/W2 and all earlier W3/W4 experiments are retained as historical results.
# Daily's final feature/model choices remain independent and are saved in
# configs/daily_final.yaml.
# ============================================================

data:
  daily_path: data/processed/spy_labeled_daily.csv
  weekly_path: data/processed/spy_labeled_weekly_merged.csv
  target: target_return
  training_start_year: 2010

# ============================================================
# FEATURE SET OPTION A: INITIAL MODEL SEARCH (21 FEATURES)
# Use for the first model search in either pipeline.
# Comment out Option B before uncommenting this block.
# ============================================================
features:
  - return_1d
  - momentum_5d
  - momentum_20d
  - volatility_5d
  - volatility_20d
  - volatility_60d
  - ma_gap_5_20
  - vix
  - rsi_14
  - relative_volume_20d
  - intraday_return
  - overnight_return
  - intraday_momentum_5d
  - gap_reversal
  - qqq_spy_relative_5d
  - tlt_return_5d
  - yield_2y_change_5d
  - yield_10y_change_5d
  - yield_10y_change_20d
  - yield_curve_10y_2y
  - real_yield_10y_change_5d


# ============================================================
# FEATURE SET OPTION B: DAILY G5 (14 FEATURES)
# Use for Daily Lasso refinement; comment out Option A.
# ============================================================
# features:
#   - return_1d
#   - momentum_5d
#   - volatility_20d
#   - volatility_60d
#   - vix
#   - intraday_return
#   - overnight_return
#   - gap_reversal
#   - tlt_return_5d
#   - yield_2y_change_5d
#   - yield_10y_change_5d
#   - yield_10y_change_20d
#   - yield_curve_10y_2y
#   - real_yield_10y_change_5d


# ============================================================
# SHARED DATA SPLITS AND ROLLING TRAINING RULES
# Used across model searches and refinement experiments.
# ============================================================
validation:
  start_year: 2018
  end_year: 2021
  selection_metric: rmse
  secondary_metrics: [mae, r2]
  aggregation: pooled

test:
  start_year: 2022
  end_year: 2025

training:
  window: rolling
  window_years: 5
  retraining: monthly
  label_availability_rule: holding_end_date_before_retraining

pipelines:
  daily:
    data_key: daily_path
    signal_interval_trading_days: 1
    prediction_horizon_trading_days: 1
    holding_period_trading_days: 1
  weekly:
    data_key: weekly_path
    signal_interval_trading_days: 5
    prediction_horizon_trading_days: 5
    holding_period_trading_days: 5

